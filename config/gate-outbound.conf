# config/gate-outbound.conf: deployment patterns for bin/hooks/gate-outbound-reply.sh
# (sourced by the hook; python regexes with ONE capture group = the value to verify).
# Leave a pattern empty to skip that half of the credential check. Examples:
#   GATE_URL_RE='example-gate\?p=([A-Za-z0-9!._~-]+)'      # an environment gate URL
#   GATE_LOGIN_RE='admin@example\.com\s*/\s*`?([^\s`<]+)'   # "login / password" in prose
GATE_URL_RE=''
GATE_LOGIN_RE=''
